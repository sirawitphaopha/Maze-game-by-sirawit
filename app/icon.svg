<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- ไอคอนเว็บ เขาวงกตจริง 4 × 4 ช่อง พื้นฟ้าน้ำทะเลตามโทนเว็บ (พี่กันสั่ง 21 ต.ค. 2569 "ทำไอคอนเว็บเป็นรูปเขาวงกตเล็ก ๆ")
       ทางเข้าบนช่องที่สอง ทางออกล่างช่องที่สาม ทุกช่องไปถึงกันได้ ไม่มีวง เดินออกได้ทางเดียว 11 ช่อง (ตรวจด้วยสคริปต์แล้ว)
       รอบแรกวาดกำแพงสุ่ม เดินออกไม่ได้ พี่กันทัก "อันนี้ไม่ใช่เขาวงกต มันวิ่งออกไม่ได้"
       จุดชมพูคือตัวผู้เล่นที่ทางเข้า ห่างกำแพงทุกด้าน ไม่ทับเส้น (พี่กันทัก "วงไม่ทับเส้นสิ") -->
